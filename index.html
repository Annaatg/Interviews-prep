<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Floor Academy</title>
  <meta name="description" content="Application gamifiée pour apprendre la finance de marché et préparer les entretiens Sales & Trading (front, middle et back office).">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="logo"><i class="fa-solid fa-chart-simple"></i></span><span>Trading Floor <b>Academy</b></span></a>
    <nav class="nav">
      <a href="#/"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a href="#/modules" data-match="#/module"><i class="fa-solid fa-book-open"></i> Modules</a>
      <a href="#/flashcards" data-match="#/flash"><i class="fa-solid fa-clone"></i> Flashcards</a>
      <a href="#/entretiens" data-match="#/simulation"><i class="fa-solid fa-user-tie"></i> Entretiens</a>
      <a href="#/arena" data-match="#/arena"><i class="fa-solid fa-dice"></i> Arena</a>
      <a href="#/glossaire"><i class="fa-solid fa-spell-check"></i> Glossaire</a>
      <a href="#/ressources"><i class="fa-solid fa-compass"></i> Ressources</a>
    </nav>
    <div class="player">
      <div class="p-level" id="hdr-level"></div>
      <div class="p-xp"><span id="hdr-xp"></span><div class="bar mini"><span id="hdr-bar"></span></div></div>
      <div class="p-streak" id="hdr-streak" title="Série de jours"></div>
    </div>
    <button class="burger" id="burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  </header>

  <main id="app" class="container"></main>
  <div id="toasts"></div>

  <footer class="foot">Trading Floor Academy · contenu pédagogique, pas un conseil en investissement · progression stockée localement dans ton navigateur</footer>

  <script src="js/data-modules.js"></script>
  <script src="js/data-interviews.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
